name: Publish Release

on:
  push:
    branches: [main]

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: holochain/actions/.github/workflows/nodejs-publish-release.yml@v1.16.0
    with:
      build_script: build:dist
      workspace_main_package: ./packages/api/package.json
