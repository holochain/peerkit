[package]
name = "peerkit-iroh"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi9",
    "tokio_rt",
] }
napi-derive = "3"
iroh = "1.0.0"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"
